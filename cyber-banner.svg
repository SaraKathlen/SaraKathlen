
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">

  <defs>
    <linearGradient id="background">
      <stop offset="0%" stop-color="#080808"/>
      <stop offset="50%" stop-color="#300008"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#FF003C" stroke-width="0.4" opacity="0.2"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="260" rx="12" fill="url(#background)"/>
  <rect width="1000" height="260" fill="url(#grid)"/>

  <g fill="none" stroke="#FF003C" stroke-width="1.5" opacity="0.7">
    <path d="M0 35H90L125 70H210"/>
    <path d="M0 65H65L100 100H180"/>
    <path d="M0 200H100L140 160H200"/>
    <path d="M1000 35H910L875 70H790"/>
    <path d="M1000 65H935L900 100H820"/>
    <path d="M1000 200H900L860 160H800"/>
  </g>

  <g fill="#FF003C" filter="url(#glow)">
    <circle r="4">
      <animateMotion dur="3s" repeatCount="indefinite" path="M0 35H90L125 70H210"/>
    </circle>

    <circle r="3">
      <animateMotion dur="4s" repeatCount="indefinite" path="M0 200H100L140 160H200"/>
    </circle>

    <circle r="4">
      <animateMotion dur="3s" repeatCount="indefinite" path="M1000 35H910L875 70H790"/>
    </circle>

    <circle r="3">
      <animateMotion dur="4s" repeatCount="indefinite" path="M1000 200H900L860 160H800"/>
    </circle>
  </g>

  <g transform="translate(110 130)">
    <g fill="none" stroke="#FF003C">
      <circle r="42" stroke-dasharray="12 8" opacity="0.6"/>
      <circle r="34" stroke-dasharray="35 12" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text y="8" text-anchor="middle" font-family="monospace" font-size="23" fill="#FF003C">&lt;/&gt;</text>
  </g>

  <g transform="translate(890 130)">
    <g fill="none" stroke="#FF003C">
      <circle r="42" stroke-dasharray="12 8" opacity="0.6"/>
      <circle r="34" stroke-dasharray="35 12" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text y="8" text-anchor="middle" font-family="monospace" font-size="24" fill="#FF003C">{ }</text>
  </g>

  <g fill="#FF003C" opacity="0.35" font-family="monospace" font-size="12">
    <text x="30" y="25">01001101</text>
    <text x="30" y="240">10110010</text>
    <text x="900" y="25">11001001</text>
    <text x="900" y="240">00101101</text>

    <text x="220" y="50">01
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite"/>
    </text>

    <text x="760" y="210">10
      <animate attributeName="opacity" values="1;0.1;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="500" y="42" text-anchor="middle" fill="#FF003C" font-family="monospace" font-size="12" letter-spacing="5">
    SISTEMA ONLINE
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </text>

  <text x="500" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" letter-spacing="4" fill="#FF003C" filter="url(#glow)">
    SARA KATHLEN
  </text>

  <text x="500" y="157" text-anchor="middle" font-family="monospace" font-size="18" letter-spacing="3" fill="#FFFFFF">
    ENGENHARIA DE SOFTWARE
  </text>

  <rect x="300" y="178" width="400" height="2" fill="#FF003C" opacity="0.4"/>

  <rect x="300" y="178" width="80" height="2" fill="#FF003C" filter="url(#glow)">
    <animate attributeName="x" values="300;620;300" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="500" y="210" text-anchor="middle" font-family="monospace" font-size="12" letter-spacing="2" fill="#DDDDDD">
    TECNOLOGIA // CRIATIVIDADE // INOVAÇÃO
  </text>

  <circle cx="500" cy="235" r="4" fill="#FF003C" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

</svg>
